<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Klotski Explorer 3D</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --bg: #020205;
      --card: #0a0a0f;
      --accent-red: #ff3333;
      --text: #ffffff;
      --border: #222;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* --- Sidebar --- */
    #sidebar {
      width: 320px;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
      z-index: 10;
      overflow-y: auto;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 16px;
      margin: 0 0 20px;
      color: var(--accent-red);
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      text-transform: uppercase;
    }

    .label {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
      letter-spacing: 1px;
    }

    /* --- Piece Buttons --- */
    .piece-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 20px;
    }

    .tool-btn {
      background: #111;
      border: 1px solid var(--border);
      padding: 10px 2px;
      color: #888;
      cursor: pointer;
      font-size: 10px;
      border-radius: 4px;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .tool-btn:hover {
      border-color: var(--accent-red);
      color: #fff;
    }

    .tool-btn.active {
      background: var(--accent-red);
      color: #000;
      border-color: #fff;
      font-weight: 700;
    }

    .tool-btn .box-ico {
      background: #fff;
      border: 1px solid #000;
    }

    #board-canvas {
      width: 100%;
      background: #000;
      border: 1px solid #333;
      cursor: crosshair;
      margin-bottom: 15px;
      border-radius: 4px;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      background: #fff;
      color: #000;
      border: none;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
    }

    .action-btn:hover {
      background: var(--accent-red);
      color: #fff;
      transform: translateY(-1px);
    }

    .action-btn.secondary {
      background: transparent;
      color: #aaa;
      border: 1px solid #333;
    }

    .action-btn.secondary:hover {
      color: #fff;
      border-color: #666;
    }

    #piece-list {
      margin-top: 15px;
      border-top: 1px solid var(--border);
      padding-top: 15px;
    }

    .p-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px;
      font-size: 10px;
      border-bottom: 1px dotted #222;
    }

    .p-color {
      width: 8px;
      height: 8px;
      border-radius: 1px;
    }

    /* --- Main View --- */
    #main-view {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #050510 0%, #000 100%);
    }

    #graph-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #overlay {
      position: absolute;
      top: 25px;
      left: 25px;
      pointer-events: none;
    }

    .badge {
      background: var(--accent-red);
      color: #000;
      padding: 4px 8px;
      font-weight: 700;
      font-size: 10px;
      border-radius: 2px;
    }

    #controls-hint {
      position: absolute;
      bottom: 25px;
      right: 25px;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 11px;
      color: #888;
      line-height: 1.6;
    }

    #controls-hint b {
      color: #fff;
    }

    #stats {
      position: absolute;
      bottom: 25px;
      left: 25px;
      font-size: 10px;
      color: #444;
    }
  </style>
</head>
<body>

<aside id="sidebar">
  <h1>Klotski Engine</h1>

  <span class="label">Baumodus</span>
  <div class="piece-tools">
    <button class="tool-btn active" data-h="1" data-w="1">
      <div class="box-ico" style="width:8px; height:8px;"></div>
      1x1
    </button>
    <button class="tool-btn" data-h="2" data-w="1">
      <div class="box-ico" style="width:8px; height:16px;"></div>
      1x2↕
    </button>
    <button class="tool-btn" data-h="1" data-w="2">
      <div class="box-ico" style="width:16px; height:8px;"></div>
      2x1↔
    </button>
    <button class="tool-btn" data-h="2" data-w="2">
      <div class="box-ico" style="width:16px; height:16px;"></div>
      2x2
    </button>
  </div>

  <canvas id="board-canvas"></canvas>

  <button class="action-btn" id="build-graph">Berechne Universum</button>
  <button class="action-btn secondary" id="load-default">Preset Laden</button>
  <button class="action-btn secondary" id="clear-board">Leeren</button>

  <div id="piece-list">
    <span class="label">Steine & Ziel</span>
    <div id="pieces-container"></div>
  </div>
</aside>

<main id="main-view">
  <canvas id="graph-canvas"></canvas>

  <div id="overlay">
    <span class="badge">3D SPACE</span>
  </div>

  <div id="controls-hint">
    <b>WASD</b> Fliegen<br>
    <b>SPACE/SHIFT</b> Auf/Ab<br>
    <b>MAUS</b> Umsehen<br>
    <b>RAD</b> Speed: <span id="speed-val">1.0</span>x
  </div>

  <div id="stats">Nodes: 0 | Edges: 0</div>
</main>

<script src="index.js"></script>
</body>
</html>
